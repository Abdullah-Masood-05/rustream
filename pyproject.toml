[project]
name = "rustream"
version = "0.1.0"
description = "Zero-copy multi-modal stream fusion engine for real-time AI pipelines"
readme = "README.md"
license = "AGPL-3.0-only"
authors = [
    { name = "Abdullah Masood", email = "Abdullah-Masood-05@users.noreply.github.com" }
]
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "numpy>=1.20",
]

[tool.maturin]
module-name = "rustream._core"
python-packages = ["rustream"]
python-source = "src"

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**/*.rs" }, { file = "Cargo.toml" }, { file = "Cargo.lock" }]

[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"
