[package]
name = "vigilo-stream"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "Zero-copy multi-modal stream fusion engine for real-time AI pipelines"

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.28", features = ["extension-module", "abi3-py39"] }
vigilo-core = { git = "https://github.com/Abdullah-Masood-05/vigilo-core.git", branch = "main" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
image = "0.25"
ndarray = "0.17"
arc-swap = "1"
crossbeam-channel = "0.5"

[target.'cfg(target_os = "linux")'.dependencies]
openssl = { version = "0.10", features = ["vendored"] }

[profile.release]
strip = true
lto = true
