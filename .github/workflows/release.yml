name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  linux:
    name: Build Linux Wheels (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --find-interpreter
          manylinux: 2_28
          before-script-linux: |
            dnf install -y openssl-devel perl-core || yum install -y openssl-devel perl-core
      - name: Build GPU backend (CUDA)
        run: |
          cargo build --release --features gpu-cuda
          mkdir -p gpu-bundle
          cp target/release/lib_core.so gpu-bundle/_core_gpu.so || true
          find target/release -maxdepth 1 -name "*.so*" -exec cp {} gpu-bundle/ \;
          cd gpu-bundle && zip -r ../dist/vigilo-stream-gpu-linux-x86_64.zip .
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.target }}
          path: dist

  windows:
    name: Build Windows Wheels (${{ matrix.target }})
    runs-on: windows-latest
    strategy:
      matrix:
        target: [x86_64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --find-interpreter
      - name: Build GPU backend (DirectML)
        shell: bash
        run: |
          cargo build --release --features gpu-directml
          mkdir -p gpu-bundle
          cp target/release/_core.dll gpu-bundle/_core_gpu.pyd
          find target/release -maxdepth 1 -name "*.dll" -exec cp {} gpu-bundle/ \;
          cd gpu-bundle && 7z a -tzip ../dist/vigilo-stream-gpu-windows-x86_64.zip .
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-${{ matrix.target }}
          path: dist

  macos:
    name: Build macOS Wheels (${{ matrix.target }})
    runs-on: macos-14
    strategy:
      matrix:
        target: [aarch64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --find-interpreter
      - name: Build GPU backend (CoreML)
        run: |
          RUSTFLAGS="-C link-arg=-undefined -C link-arg=dynamic_lookup" cargo build --release --features gpu-coreml
          mkdir -p gpu-bundle
          cp target/release/lib_core.dylib gpu-bundle/_core_gpu.so || true
          find target/release -maxdepth 1 -name "*.dylib*" -exec cp {} gpu-bundle/ \;
          cd gpu-bundle && zip -r ../dist/vigilo-stream-gpu-macos-arm64.zip .
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.target }}
          path: dist

  sdist:
    name: Build Source Distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist

  publish:
    name: Publish to PyPI and Create GitHub Release
    runs-on: ubuntu-latest
    needs: [linux, windows, macos, sdist]
    environment: pypi
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: vigilo-stream ${{ github.ref_name }}
          files: dist/*
          generate_release_notes: true
      - name: Separate PyPI wheels from GPU release archives
        run: |
          mkdir -p pypi-dist
          cp dist/*.whl pypi-dist/ 2>/dev/null || true
          cp dist/*.tar.gz pypi-dist/ 2>/dev/null || true
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: pypi-dist

